<!DOCTYPE html>
<html>
<head>
  <style>
    :root {
      font-family: "Adobe Clean", "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      padding: 14px;
      background-color: var(--uxp-host-background-color, #323232);
      color: var(--uxp-host-text-color, #e0e0e0);
      font-size: var(--uxp-host-font-size, 11px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      box-sizing: border-box;
    }

    /* ── 전체 레이아웃 ── */
    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    .content .logo {
      width: 140px;
      height: auto;
      display: block;
      flex-shrink: 0;
      user-select: none;
      -webkit-user-drag: none;
    }
    .content .title-image {
      max-width: 128px;
      width: auto;
      height: auto;
      display: block;
      flex-shrink: 0;
      margin-top: 4px;
      margin-bottom: 2px;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* ── 컨트롤 행 (인디케이터 좌 / 토글 우) ── */
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      flex-shrink: 0;
      margin-top: 8px;
    }
    .control-left, .control-right {
      display: flex;
      align-items: center;
    }
    .control-left .control-label {
      margin-left: 6px;
    }
    .control-right .control-label {
      margin-right: 6px;
    }
    .control-label {
      font-size: 10px;
      color: var(--uxp-host-text-color-secondary, #999);
      user-select: none;
      white-space: nowrap;
    }

    /* ── 인디케이터 ── */
    #dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #dc3545;
      flex-shrink: 0;
      transition: background-color 0.3s ease;
      padding-right: 8px;
    }
    #dot.connected {
      background-color: #28a745;
    }

    /* ── 토글 (Spectrum 스타일 sp-switch 모방) ── */
    .sp-switch {
      position: relative;
      display: block;
      width: 26px;
      height: 14px;
      cursor: pointer;
      padding-left: 8px;
    }
    .sp-switch input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    .sp-switch-track {
      position: absolute;
      top: 0;
      left: 0;
      width: 26px;
      height: 14px;
      border-radius: 7px;
      background-color: var(--uxp-host-border-color, #636363);
      box-sizing: border-box;
      transition: background-color 0.15s ease;
    }
    .sp-switch input:checked + .sp-switch-track {
      background-color: var(--uxp-host-text-color, #cfcfcf);
    }
    .sp-switch-handle {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--uxp-host-background-color, #2b2b2b);
      transition: left 0.15s ease;
      pointer-events: none;
    }
    .sp-switch input:checked ~ .sp-switch-handle {
      left: 14px;
    }

    #log {
      display: block;
      max-height: 100px;
      overflow-y: auto;
      font-size: 9px;
      margin-top: 6px;
      width: 100%;
      background: rgba(0,0,0,0.25);
      padding: 4px;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <!-- 전체 콘텐츠 -->
  <div class="content">
    <img id="logo-img" class="logo" src="logo_dark.png" alt="Paraglide" />
    <img id="title-img" class="title-image" src="TitleDark.png" alt="Paraglide" />
    <!-- 인디케이터(좌) + 토글(우) -->
    <div class="control-row">
      <div class="control-left">
        <div id="dot"></div>
        <span id="status-label" class="control-label">Disconnected</span>
      </div>
      <div class="control-right">
        <span id="toggle-label" class="control-label">ON</span>
        <label class="sp-switch">
          <input type="checkbox" id="toggle-connection" checked>
          <div class="sp-switch-track"></div>
          <div class="sp-switch-handle"></div>
        </label>
      </div>
    </div>
  </div>

  <pre id="log"></pre>
  <script src="plugin.js"></script>
</body>
</html>
